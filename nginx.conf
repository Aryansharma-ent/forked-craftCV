# nginx SPA config – serves the React/Vite app correctly.
# Key: "try_files $uri $uri/ /index.html" lets react-router handle all routes
# without nginx returning 404 on direct URL loads (e.g. /templates, /login).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve assets with long cache since Vite hashes filenames.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback – all other paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Expose Prometheus metrics endpoint with correct OpenMetrics/Prometheus exposition format
    location /metrics {
        access_log off;
        default_type "text/plain; version=0.0.4; charset=utf-8";
        return 200 "# HELP craftcv_frontend_up Whether the CraftCV frontend web server is responding\n# TYPE craftcv_frontend_up gauge\ncraftcv_frontend_up 1\n# HELP craftcv_frontend_http_requests_total Total HTTP requests handled\n# TYPE craftcv_frontend_http_requests_total counter\ncraftcv_frontend_http_requests_total 1\n";
    }

    # Health-check endpoint
    location /health {
        access_log off;
        default_type "text/plain; charset=utf-8";
        return 200 "OK\n";
    }
}
